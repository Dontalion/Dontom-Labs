hugoblox:
  schema: "2.0"
  identity:
    name: Dontom Labs
    type: organization
    tagline: The AI Compute and Intelligence Laboratory
    description: Research and engineering at Dontom Labs. Unlocking AI performance through GPU programming, Deep Learning architectures, and scalable intelligent systems.
  theme:
    mode: system
    pack: minimal
    colors:
      primary: violet
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: lg
    pack: modern
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: rounded
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
